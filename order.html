    <style>
        body {
            font-family: 'Open Sans', sans-serif;

            margin: 0;
            padding: 0;
        }

        #order {
            width: 100%;
            max-width: 700px;
            background-color: #fff;
            border-radius: 15px;
            border: 1px solid #ddd;
            padding: 40px 30px;

            margin: 60px auto;

        }

        #order h1 {
            font-size: 2em;
            text-align: center;
            color: #ff7f50;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }

        .vvod {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
            background-color: #f7f7f7;
            color: #333;
            font-size: 14px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .vvod:focus {
            border-color: #ff7f50;
            outline: none;

        }

        #send {
            display: block;
            width: 100%;
            background-color: #ff7f50;
            color: white;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        #send:hover {
            background-color: #ff5722;
        }

        #error {
            color: #e74c3c;
            text-align: center;
            display: none;
            margin-top: 20px;
        }

        textarea.vvod {
            min-height: 100px;
            resize: vertical;
        }

        @media (max-width: 768px) {
            #order {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

  </div> 
    <div id="order">
        <h1>Бронирование</h1>
        <form id="form">
            <label for="name">Имя и Фамилия</label>
            <input type="text" id="name" class="vvod" placeholder="Введите имя и фамилию">

            <label for="phone">Номер телефона</label>
            <input type="tel" id="phone" class="vvod" placeholder="+7 (___) ___-__-__">

            <label for="email">Email</label>
            <input type="email" id="email" class="vvod" placeholder="example@mail.ru">

            <label for="members">Количество человек</label>
            <input type="number" id="members" class="vvod" placeholder="Например: 4" min="1">

            <label for="days">Количество дней</label>
            <input type="number" id="days" class="vvod" placeholder="1-3 дня" min="1" max="3">

            <label for="date">Дата сплава</label>
            <input type="date" id="date" class="vvod">

            <label for="comment">Дополнительные пожелания</label>
            <textarea id="comment" class="vvod" placeholder="Опишите пожелания или особенности"></textarea>

            <button id="send" type="submit">Отправить заявку</button>

            <p id="error">Пожалуйста, заполните все поля!</p>
        </form>
    </div>

    <script>
        const form = document.getElementById("form");
        const error = document.getElementById("error");

        form.addEventListener("submit", function (e) {
            e.preventDefault(); // Предотвращаем перезагрузку страницы

            const name = document.getElementById("name").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const members = document.getElementById("members").value.trim();
            const days = document.getElementById("days").value.trim();
            const date = document.getElementById("date").value.trim();
            const comment = document.getElementById("comment").value.trim();

            // Проверка заполнения полей
            if (!name || !phone || !email || !members || !days || !date) {
                error.style.display = "block";
                return;
            }

            // Проверка email и телефона
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phonePattern = /^\+?\d[\d\-\s]{8,}$/;

            if (!emailPattern.test(email)) {
                error.style.display = "block";
                error.textContent = "Введите корректный email!";
                return;
            }

            if (!phonePattern.test(phone)) {
                error.style.display = "block";
                error.textContent = "Введите корректный номер телефона!";
                return;
            }

            error.style.display = "none";

            // Сбор сообщения
            const message = `
                📌 *Новая заявка на сплав!*
                👤 Имя: *${name}*
                📞 Телефон: *${phone}*
                ✉️ Email: *${email}*
                👥 Кол-во человек: *${members}*
                🗓 Кол-во дней: *${days}*
                📅 Дата: *${date}*
                💬 Пожелания: _${comment || "Нет"}_
            `;

            // Отправка в Telegram
            const token = "7353890051:AAFOe8Sa_XOZp9ZmlQHoaBvaR7tbdV2-9OM"; // вставь свой токен сюда
            const chat_id = "749687151"; // вставь свой chat_id сюда
            const url = `https://api.telegram.org/bot${token}/sendMessage`;

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: chat_id,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(res => {
                if (res.ok) {
                    console.log("Заявка отправлена успешно!");
                    alert("Заявка успешно отправлена!");
                    form.reset();
                } else {
                    console.error("Ошибка при отправке:", res);
                    alert("Ошибка при отправке. Попробуйте позже.");
                }
            })
            .catch(err => {
                console.error("Сетевая ошибка:", err);
                alert("Сетевая ошибка. Попробуйте позже.");
            });
        });
    </script>
